version: "1.0.0"
description: ESP-IDF component for EEPROM-based board identification, hardware manifests, and component status tracking.
license: MIT
url: https://github.com/ptudor/esp32-hardware-discovery
repository: https://github.com/ptudor/esp32-hardware-discovery.git
documentation: https://github.com/ptudor/esp32-hardware-discovery#readme
issues: https://github.com/ptudor/esp32-hardware-discovery/issues
tags:
  - esp32
  - eeprom
  - i2c
  - hardware-discovery

dependencies:
  idf:
    version: ">=5.2.0"

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c2
  - esp32c3
  - esp32c6
  - esp32h2
